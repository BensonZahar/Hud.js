<style>
/* Размеры и градиент шарика — из Hud.css игры (единица u = 1vh игры) */
:root{--u:calc(min(100vh,160vw)/100);--a:#e0bf3e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none;-webkit-touch-callout:none;background:#010106;color:#eeeee6;font:italic 700 calc(var(--u)*2.4) "Open Sans",Arial,sans-serif}
#pad{position:fixed;inset:0;padding-bottom:env(safe-area-inset-bottom)}
#st{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;text-align:center;color:#fff9;text-transform:uppercase;font-size:calc(var(--u)*2)}
#sp{position:absolute;left:0;top:calc(var(--u)*-21);width:100%;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .15s}#sp.on{opacity:1}
.sb{width:calc(var(--u)*7.22);height:calc(var(--u)*7.22)}.sb img{width:100%;height:100%}
#sph{position:absolute;width:calc(var(--u)*13.24);height:calc(var(--u)*13.15);margin-top:calc(var(--u)*9.07)}
#stick{position:absolute;width:calc(var(--u)*17.22);height:calc(var(--u)*17.22);margin:calc(var(--u)*-8.61) 0 0 calc(var(--u)*-8.61);opacity:0;transition:opacity .1s;pointer-events:none}
#stick.on{opacity:1}
#ring{position:absolute;left:50%;top:50%;width:calc(var(--u)*24.07);height:calc(var(--u)*24.07);margin:calc(var(--u)*-12.035) 0 0 calc(var(--u)*-12.035)}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--u)*7.22);height:calc(var(--u)*7.22);margin:calc(var(--u)*-3.61) 0 0 calc(var(--u)*-3.61);border-radius:50%;background:radial-gradient(31.75% 31.29% at 23.75% 36.62%,#ffffffb3 0,#fff0 100%),radial-gradient(58.18% 3045.17% at 16.16% 63.76%,#ffffff40 0,#fff0 41.46%),radial-gradient(122.95% 148.69% at 42.97% -.07%,#ffffffb3 0,#fff0 48.58%),linear-gradient(105.38deg,#f8f6ed 21.49%,#c8c8c7 60.57%),#f8f6ed}
.mb{position:fixed;right:calc(var(--u)*3);width:calc(var(--u)*14.44);height:calc(var(--u)*14.44);border-radius:50%}.mb img{width:100%;height:100%;pointer-events:none;display:block}
#bA{bottom:calc(var(--u)*22 + env(safe-area-inset-bottom))}#bJ{bottom:calc(var(--u)*5 + env(safe-area-inset-bottom));right:calc(var(--u)*20)}</style></head><body>
